name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (which happens after 15 mins of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger just in case

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          # Use curl to ping the health endpoint and fail the job if it doesn't return HTTP 200
          # We use --fail to ensure non-200 responses return an error code
          # We don't fail the whole action immediately on error to allow for temporary deployment downtime
          curl --fail -sS "https://polaris-backend.onrender.com/api/health" || echo "Ping failed, but continuing..."
